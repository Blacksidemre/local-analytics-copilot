name: LAC Integration

on:
  push:
    branches: [lac-data-bridge-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lac-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-ui-contract:
    name: Bridge and UI contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check integration formatting
        run: |
          pnpm exec prettier --check \
            scripts/lac-hybrid-smoke.mjs \
            scripts/desktop-prerequisites.mjs \
            scripts/run-desktop.mjs \
            scripts/build-desktop.mjs \
            scripts/run-next.mjs \
            src/__tests__/desktop-launcher-script.test.ts \
            src/__tests__/run-next-script.test.ts \
            src/lib/lac-bridge-client.ts \
            src/lib/__tests__/lac-bridge-client.test.ts \
            src/app/components/lac-quick-workspace.tsx \
            src/app/components/__tests__/lac-quick-workspace.test.tsx \
            'src/app/api/lac/[...path]/route.ts' \
            'src/app/api/lac/[...path]/__tests__/route.test.ts'
      - name: Check integration lint and types
        run: |
          pnpm exec eslint \
            scripts/lac-hybrid-smoke.mjs \
            scripts/desktop-prerequisites.mjs \
            scripts/run-desktop.mjs \
            scripts/build-desktop.mjs \
            scripts/run-next.mjs \
            src/__tests__/desktop-launcher-script.test.ts \
            src/__tests__/run-next-script.test.ts \
            src/lib/lac-bridge-client.ts \
            src/lib/__tests__/lac-bridge-client.test.ts \
            src/app/components/lac-quick-workspace.tsx \
            src/app/components/__tests__/lac-quick-workspace.test.tsx \
            'src/app/api/lac/[...path]/route.ts' \
            'src/app/api/lac/[...path]/__tests__/route.test.ts'
          pnpm run type-check
      - name: Run bridge, UI, proxy and launcher tests
        run: |
          pnpm exec vitest run \
            src/lib/__tests__/lac-bridge-client.test.ts \
            src/app/components/__tests__/lac-quick-workspace.test.tsx \
            'src/app/api/lac/[...path]/__tests__/route.test.ts' \
            src/__tests__/desktop-launcher-script.test.ts \
            src/__tests__/run-next-script.test.ts

  windows-launcher:
    name: Windows Node 24 launcher
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print shell-free launcher command
        run: |
          node scripts/run-next.mjs dev --print-command
          node scripts/run-desktop.mjs dev --print-command
      - name: Check Windows desktop prerequisites
        run: node scripts/run-desktop.mjs dev --check-prerequisites
      - name: Run Windows ESM launcher regression
        run: pnpm exec vitest run src/__tests__/run-next-script.test.ts src/__tests__/desktop-launcher-script.test.ts

  windows-tauri-shell:
    name: Windows Tauri shell
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile the Windows desktop shell
        working-directory: src-tauri
        run: cargo check --locked

  live-hybrid-contract:
    name: Live LAC and Hermetic contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Hermetic integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out LAC integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Blacksidemre/local-analytics-copilot
          ref: hermetic-hybrid-integration
          path: .lac-integration-source
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .lac-integration-source/pyproject.toml
      - name: Install LAC Data Bridge
        run: python -m pip install -e ./.lac-integration-source
      - name: Generate controlled CSV and XLSX fixtures
        working-directory: .lac-integration-source
        env:
          LAC_WORKSPACE: ${{ runner.temp }}/lac-workspace
          LAC_CONFIG_DIR: ${{ runner.temp }}/lac-config
        run: python scripts/generate_credit_risk_regression.py
      - name: Start LAC Data Bridge
        env:
          LAC_WORKSPACE: ${{ runner.temp }}/lac-workspace
          LAC_CONFIG_DIR: ${{ runner.temp }}/lac-config
        run: |
          python -m uvicorn lacopilot.app:app --host 127.0.0.1 --port 8765 \
            > "${RUNNER_TEMP}/lac-bridge.log" 2>&1 &
          echo "LAC_PID=$!" >> "${GITHUB_ENV}"
      - name: Exercise the live hybrid contract
        run: |
          node scripts/lac-hybrid-smoke.mjs \
            http://127.0.0.1:8765 \
            "${RUNNER_TEMP}/lac-workspace/incoming/Kredi_Temerrut_Riski_Sentetik_Test.csv" \
            "${RUNNER_TEMP}/lac-workspace/incoming/Kredi_Temerrut_Riski_Sentetik_Test.xlsx"
      - name: Print LAC log on failure
        if: failure()
        run: cat "${RUNNER_TEMP}/lac-bridge.log"
      - name: Stop LAC Data Bridge
        if: always()
        run: kill "${LAC_PID}" 2>/dev/null || true
