[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-analytics-copilot"
version = "1.0.0rc1"
description = "Local-first AI data analyst, statistics mentor, BI and NPL copilot powered by Ollama."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Yunus Emre Büyükgüler"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<16",
  "PyYAML>=6.0,<7",
  "ollama>=0.4,<1",
  "pandas>=2.2,<4",
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "statsmodels>=0.14,<1",
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.9,<4",
  "plotly>=5.24,<8",
  "openpyxl>=3.1,<4",
  "xlsxwriter>=3.2,<4",
  "xlrd>=2.0,<3",
  "python-multipart>=0.0.12,<1",
  "psutil>=6.0,<8",
  "SQLAlchemy>=2.0,<3",
  "sqlglot>=27,<31",
  "requests>=2.32,<3",
  "httpx[socks]>=0.27,<1",
  "pypdf>=5.0,<7",
  "python-docx>=1.1,<2",
  "reportlab>=4.2,<6"
]

[project.urls]
Homepage = "https://github.com/Blacksidemre/local-analytics-copilot"
Repository = "https://github.com/Blacksidemre/local-analytics-copilot"
Issues = "https://github.com/Blacksidemre/local-analytics-copilot/issues"

[project.optional-dependencies]
fast = ["polars>=1.0", "duckdb>=1.1", "pyarrow>=17"]
web = ["ddgs>=9.0"]
watch = ["watchdog>=5.0"]
survival = ["lifelines>=0.30"]
databases = ["psycopg[binary]>=3.2", "pyodbc>=5.1"]
windows = ["pywin32>=306; platform_system == 'Windows'"]
ocr = ["pymupdf>=1.24", "pytesseract>=0.3", "Pillow>=10"]
all = [
  "polars>=1.0", "duckdb>=1.1", "pyarrow>=17", "ddgs>=9.0",
  "watchdog>=5.0", "lifelines>=0.30", "psycopg[binary]>=3.2", "pyodbc>=5.1",
  "pywin32>=306; platform_system == 'Windows'"
]
dev = [
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=5.0,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
lac = "lacopilot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lacopilot = ["resources/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
extend-exclude = [".venv", ".venv-*", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.coverage.run]
source = ["lacopilot"]
omit = [
  "src/lacopilot/cli.py",
  "src/lacopilot/hardware.py",
  "src/lacopilot/model_benchmark.py",
  "src/lacopilot/project_review.py",
  "src/lacopilot/tools/excel_native.py",
  "src/lacopilot/watcher.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60
